name: Gerar APK Android
on:
  push:
    branches: [main]
    paths: ['android/**','web/**','.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar interface offline
        run: mkdir -p android/app/src/main/assets/web && cp web/* android/app/src/main/assets/web/
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Renomear instalador
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ritmo78.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ritmo78-Android
          path: Ritmo78.apk
      - name: Publicar instalador
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0
          name: Ritmo78 Android v0.4.0
          body: APK de testes para instalação fora da Play Store. Dados e fotos ficam no dispositivo.
          files: Ritmo78.apk
          make_latest: true